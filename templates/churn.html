<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChurnIQ — Prediction Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030712;
    --bg-grid: rgba(16, 185, 129, 0.03);
    --panel: #0F172A;
    --panel-border: rgba(16, 185, 129, 0.2);
    --panel-border-soft: rgba(255, 255, 255, 0.08);
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --signal: #10B981;
    --signal-hover: #059669;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg);
    background-image: 
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 40px 40px;
    color: var(--text-main);
    font-family: var(--font-body);
    padding: 32px 20px 60px;
  }

  .form-container {
    max-width: 850px;
    margin: 0 auto;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-border-soft);
    padding: 18px 28px;
    border-radius: 14px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); }
  .brand-dot {
    width: 10px; height: 10px;
    background-color: var(--signal);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--signal);
  }
  .brand-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
  }
  .back-link {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--signal); }

  .form-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 44px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  h2 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .form-subtitle {
    font-size: 14.5px;
    color: var(--text-muted);
    margin-bottom: 36px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 4px;
  }

  label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  input, select {
    background: #090D16;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: 14.5px;
    padding: 13px 16px;
    width: 100%;
    transition: all 0.2s ease;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--signal);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
  }

  .btn-submit {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    background: linear-gradient(135deg, #10B981 0%, #059669 100%);
    color: #FFFFFF;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15.5px;
    padding: 16px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin-top: 24px;
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5);
    filter: brightness(1.05);
  }

  @media (max-width: 768px) {
    .grid-2 { grid-template-columns: 1fr; }
    .form-card { padding: 28px 20px; }
  }
</style>
</head>
<body>

  <div class="form-container">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <a href="/" class="brand">
        <div class="brand-dot"></div>
        <div class="brand-title">ChurnIQ</div>
      </a>
      <a href="/" class="back-link">← Back to Dashboard</a>
    </div>

    <!-- Form Card -->
    <div class="form-card">
      <h2>Customer Parameter Input</h2>
      <div class="form-subtitle">Provide customer account details to run the Random Forest prediction model.</div>

      <form action="/predict" method="POST">
        <div class="grid-2">
          
          <!-- Full Name -->
          <div class="form-group" style="grid-column: span 2;">
            <label for="full_name">Customer Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="e.g. John Doe" required>
          </div>

          <!-- Tenure -->
          <div class="form-group">
            <label for="tenure">Tenure (Months)</label>
            <input type="number" id="tenure" name="tenure" placeholder="e.g. 12" required>
          </div>

          <!-- Contract -->
          <div class="form-group">
            <label for="Contract">Contract Type</label>
            <select id="Contract" name="Contract" required>
              <option value="0">Month-to-Month (0)</option>
              <option value="1">One Year (1)</option>
              <option value="2">Two Year (2)</option>
            </select>
          </div>

          <!-- Monthly Charges -->
          <div class="form-group">
            <label for="MonthlyCharges">Monthly Charges ($)</label>
            <input type="number" step="0.01" id="MonthlyCharges" name="MonthlyCharges" placeholder="e.g. 70.50" required>
          </div>

          <!-- Total Charges -->
          <div class="form-group">
            <label for="TotalCharges">Total Charges ($)</label>
            <input type="number" step="0.01" id="TotalCharges" name="TotalCharges" placeholder="e.g. 850.00" required>
          </div>

        </div>

        <button type="submit" class="btn-submit">Run Churn Prediction</button>
        
        {% if prediction_text %}
          <div style="background: rgba(0, 229, 160, 0.1); border: 1px solid #10B981; padding: 15px; border-radius: 10px; margin-top: 20px; font-family: monospace; font-size: 14px; color: #10B981; text-align: center;">
            {{ prediction_text }}
          </div>
        {% endif %}
      </form>
    </div>

  </div>

<script>
  const nameInput = document.getElementById('full_name');
  if (nameInput) {
    nameInput.addEventListener('input', function() {
      this.value = this.value.replace(/[^A-Za-z\s]/g, '');
    });
  }

  document.querySelectorAll('input[type="number"]').forEach(input => {
    input.addEventListener('wheel', function(event) {
      event.preventDefault();
    });

    input.addEventListener('keydown', function(event) {
      if (event.key === '-' || event.key === 'e' || event.key === '+') {
        event.preventDefault();
      }
    });

    input.addEventListener('input', function() {
      if (this.value < 0) {
        this.value = '';
      }
    });
  });
</script>
</body>
</html>
